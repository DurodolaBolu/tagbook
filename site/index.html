/* Phones: the page itself never scrolls. #app is the scroll area and the bottom menu sits under it
   as a normal block, so iPhone's collapsing toolbar can't drag the menu up the screen. */
@media (max-width:899px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100%;margin:0}
  #app{padding-top:max(20px,env(safe-area-inset-top,0px))}
  #login,#app{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  #login{max-width:none;width:100%;padding-left:max(16px,calc((100% - 408px) / 2));padding-right:max(16px,calc((100% - 408px) / 2))}
  #app{max-width:none;width:100%;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - 408px) / 2));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100% - 408px) / 2));padding-bottom:28px}
  nav.tabs{position:relative;left:auto;right:auto;bottom:auto;flex:none;transform:none!important}
  /* Shop name and buttons stay put at the top while the page scrolls under them */
  #app{padding-top:0;scroll-padding-top:120px}
  #app .topbar{position:static}
  /* The side strips are painted by a pseudo-element, not a huge box-shadow: iPhones on iOS 16 don't clip
     that shadow and it covered the whole screen. #app clips sideways so the strips never cause sideways scroll. */
  #app{overflow-x:hidden}
  #app>header{position:sticky;top:0;z-index:4;background:var(--bg);padding-top:max(20px,env(safe-area-inset-top,0px))}
  #app>header::before{content:"";position:absolute;top:0;bottom:0;left:-100vw;right:-100vw;background:var(--bg);z-index:-1}
}
